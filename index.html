<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resume ATS Screener</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>AI Resume Screening System</h1>

    <p class="subtitle">
        Upload a candidate resume and compare it
        with the job requirements.
    </p>

    <form action="/screen"
          method="POST"
          enctype="multipart/form-data">

        <label>Candidate Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter candidate name"
            required
        >

        <label>Candidate Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter candidate email"
            required
        >

        <label>Job Description</label>

        <textarea
            name="job_description"
            rows="8"
            placeholder="Enter job description and required skills..."
            required
        ></textarea>

        <label>Upload Resume</label>

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>

</html>
